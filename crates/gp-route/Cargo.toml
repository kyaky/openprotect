[package]
name = "gp-route"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Route management (netlink on Linux)"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# The AUTHORITATIVE Windows route-table read (pre-merge review P1-1):
# `route.exe print` renders an on-link next hop as the LOCALIZED token
# `On-link` (live-confirmed on Windows 11 26100), so any text-lane
# verifier will judge a successful netsh on-link add as Absent.
# GetIpForwardTable2 hands us the same table numerically (an on-link
# next hop IS 0.0.0.0), which no locale can lie about. Same
# windows-sys 0.61 pin the sibling crates already carry, and
# cargo-deny's `[graph] targets` are Linux triples only — this is a
# cfg(windows) dep and cannot change the audited graph.
[dev-dependencies]
# Completion-record / vocabulary WARN pins capture the REAL rendered
# tracing stream (same fmt machinery the CLI's --log-file sink uses) so
# the tests assert what a field log consumer sees, not a pure seam.
# Already in Cargo.lock via sibling workspace members (gp-auth, opc);
# adds dependency EDGES to this crate's dev graph, no new packages.
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The journal line parser delegates ALL JSON-spec decisions to
# serde_json (systemic fix for the hand-rolled parser's escape holes;
# see journal_parse_line docs). Both crates are already pinned in
# Cargo.lock via sibling workspace members (opc, gp-config, gp-auth) —
# this adds dependency EDGES, not new packages, and cargo-deny's
# audited [graph] targets are Linux triples while this block is
# cfg(windows)-scoped.
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
