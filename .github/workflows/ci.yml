# Continuous integration for openprotect.
#
# Runs on every push to `main` and every pull request. The
# Rust toolchain is selected by `rust-toolchain.toml` at the
# repo root and every job inherits that choice, so CI tracks
# the same channel developers use locally.
#
# Split into four parallel jobs so a formatting failure
# short-circuits without waiting on the slower build, and a
# clippy failure surfaces while tests are still running:
#
#   * fmt      — no system deps, no caching, fastest feedback
#   * check    — full build + clippy + test with system deps
#                and a shared cargo cache
#   * docs     — workspace rustdoc generation with warnings
#                promoted to errors
#   * macos-gp-route — gp-route's tests on a real macOS runner;
#                its cfg(macos) route backend is otherwise
#                tested by no checked-in workflow
#   * cargo-deny — dependency-governance gate: RustSec
#                advisories, license allowlist, banned-crate
#                list, and source-registry lockdown, all per
#                `deny.toml` at the repo root. Runs without
#                openprotect's system deps because cargo-deny
#                only needs Cargo.toml + Cargo.lock.
#   * windows-native — gp-route/gp-ipc unit tests plus a
#                stub-mode workspace check on a real Windows
#                runner: the `cfg(windows)` backend code and
#                its test modules otherwise compile and run
#                nowhere in CI (see the job's own comment).
#
# There's intentionally no `--no-default-features` matrix
# dimension: after the embedded webview provider was retired
# in `f14a37d`, neither `gp-auth` nor `opc` declares any
# cargo features at all, so `--no-default-features` is a
# no-op build equivalent to `--all-features` and `cargo
# build` alike. If a future commit re-introduces feature
# flags, add a matrix job that covers the disabled-by-
# default combinations before merging it.
#
# Concurrency group cancels older in-progress runs for the
# same ref so a rapid-fire series of pushes doesn't eat the
# runner budget.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Scope the group by `github.workflow` as well as the ref so
  # adding a second workflow (e.g. a release or nightly-audit
  # job in a follow-up) doesn't accidentally cancel CI runs,
  # or vice versa. Within this workflow, a rapid-fire push
  # series still cancels older in-progress runs on the same
  # ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep the compilation log tight so failures are scannable.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # The action reads `rust-toolchain.toml` automatically
          # when `toolchain` is unset. Components still have to
          # be listed here so the action asks rustup to install
          # rustfmt on top of the pinned channel.
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  check:
    name: build + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenconnect-dev \
            libclang-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          # Disable the action's built-in cache so
          # `Swatinem/rust-cache` below owns caching — it has
          # a more accurate key (includes Cargo.lock + target
          # triple) and invalidates less aggressively.
          cache: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenconnect-dev \
            libclang-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-docs

      - name: Build docs
        run: cargo doc --workspace --no-deps --locked

  gui:
    name: opc-gui (windows target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `bins/opc-gui` sits OUTSIDE the workspace with its own
    # Cargo.lock, so `cargo build --workspace` never reaches it and
    # `cargo fmt --all` never format-checks it. Before this job, the
    # GUI was compiled for the first time during a release — which is
    # how v0.2.0-alpha.21 died: 11 `float_literal_f32_fallback` errors
    # in opc-gui surfaced only after every other release artifact had
    # already built, and no release was published.
    #
    # The GUI cannot be built on Linux: `eframe` is taken with
    # `default-features = false` and no `x11`/`wayland`, so winit
    # emits "The platform you're compiling for is not supported".
    # Cross-*checking* against the Windows target works fine from an
    # ubuntu runner though — no linker, no Windows minutes — and
    # since the lints that bite here are type-inference lints, they
    # fire during `cargo check`. Verified by reintroducing the
    # alpha.21 bug and watching this exact command reject it.
    #
    # macOS is not cross-checked: it needs the Apple SDK. A macOS-only
    # break is still possible, but the shared code is what changes.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          target: x86_64-pc-windows-msvc

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-gui

      - name: Check opc-gui
        run: >-
          cargo check
          --manifest-path bins/opc-gui/Cargo.toml
          --target x86_64-pc-windows-msvc
          --locked

  macos-gp-route:
    name: macos (gp-route tests)
    runs-on: macos-latest
    timeout-minutes: 20
    # Every other job runs on ubuntu, so gp-route's
    # `cfg(target_os = "macos")` route backend and its tests ran in no
    # checked-in workflow (release.yml only BUILDS macOS). That is how
    # the alpha.23..28 gateway-pin probe shipped broken: its only tests
    # were macOS-gated and fed `route get` output real macOS never
    # prints. gp-route depends only on thiserror/tracing, so this job
    # needs no libopenconnect, Homebrew or bindgen.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos-gp-route

      - name: Test gp-route (macOS route backend)
        run: cargo test -p gp-route --locked

  windows-native:
    name: windows (gp-route + gp-ipc tests, workspace check)
    runs-on: windows-latest
    timeout-minutes: 30
    # The Windows half of the workspace has never had a PR gate: every
    # other job runs on ubuntu, so `cfg(windows)` code — gp-route's
    # persistent route journal and numeric MIB route reader, bins/opc's
    # named-pipe IPC server, wintun cleanup, the HIP fallback — compiled
    # nowhere before a tag pushed it through release.yml, which runs
    # `cargo build` only and never `cargo test`. That is the alpha.21
    # failure class (a break that surfaces only at release time; see the
    # gui job's comment), and gp-route's Windows-gated test modules are
    # ~5,600 lines of regression pins that no CI job has ever executed.
    #
    # Two commands close the gap:
    #
    #   * `cargo test -p gp-route` / `-p gp-ipc` — the journal, runner,
    #     ownership and named-pipe suites. Neither crate needs
    #     libopenconnect, MSYS2, or a bindgen invocation
    #     (gp-openconnect-sys's build.rs returns before bindgen when
    #     OPENCONNECT_DIR is unset), so this is cheap on a hosted
    #     runner. Some gp-route tests spawn cmd.exe/ping.exe and write
    #     temp files — hence the timeout budget above.
    #
    #   * `cargo check --workspace --all-targets` — compiles every
    #     crate's Windows code paths, tests included, against the
    #     OpenConnect STUB (OPENCONNECT_DIR deliberately unset). A stub
    #     check cannot catch FFI-signature breaks (527d5e7 and 6736cb5
    #     were exactly that class and only the release build saw them);
    #     real-FFI Windows coverage stays a release.yml concern until a
    #     caching MSYS2 setup is justified. clippy is omitted for now:
    #     the cfg(windows) surface has never been linted and would drown
    #     the first runs in new lints — add it once this job is green.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows

      - name: Test gp-route (Windows journal, runner, ownership)
        run: cargo test -p gp-route --locked

      - name: Test gp-ipc (named-pipe liveness suite)
        run: cargo test -p gp-ipc --locked

      - name: Check workspace (OpenConnect stub)
        run: cargo check --workspace --all-targets --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cargo-deny doesn't need to compile anything — it only
    # parses Cargo.toml + Cargo.lock and walks the dep graph.
    # No system libs, no rust-cache. The action ships its own
    # cargo-deny binary pinned to a version the maintainers
    # test, which is preferable to `cargo install cargo-deny`
    # because a compromised cargo-deny release would otherwise
    # slip into CI unverified.
    steps:
      - uses: actions/checkout@v7
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # All four sections: advisories, bans, licenses,
          # sources. See `deny.toml` at the repo root for the
          # exact rules — the key policy points are:
          # RustSec advisories are hard errors, the license
          # allowlist is deny-by-default (with a per-crate
          # exception for webpki-roots's CDLA-Permissive-2.0
          # CA bundle), the retired GUI + native-tls stack
          # is banned by name, and every dep must come from
          # crates.io.
          command: check all
          # Pin `arguments: ""` so the action doesn't inject
          # any verbosity flags that would break on a future
          # cargo-deny CLI shuffle.
          arguments: ""
